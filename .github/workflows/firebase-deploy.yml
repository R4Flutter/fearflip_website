name: Deploy Firebase on Main

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBSITEANYALTICSOFFEARFLIP }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy hosting, functions, and Firestore config
        run: firebase deploy --project websiteanyalticsoffearflip --only hosting,functions,firestore --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
